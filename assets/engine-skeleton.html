function addDays(c,n){const d={...c};d.d+=n;while(d.d>daysInMonth(d.y,d.m)){d.d-=daysInMonth(d.y,d.m);d.m++;if(d.m>12){d.m=1;d.y++;}}return d;}
function addMonths(c,n){const d={...c};d.m+=n;while(d.m>12){d.m-=12;d.y++;}return d;}

    if(S.msgs.length>400){const over=S.msgs.length-340;let n=0;
      for(let i=0;i<S.msgs.length&&n<over;i++){if(S.msgs[i].read){S.msgs.splice(i,1);i--;n++;}}
      if(n<over&&S.msgs.length)S.msgs.splice(0,over-n);}
    if(S.ledger.length>240)S.ledger=S.ledger.slice(-180);
    if(S.mems.length>120)S.mems=S.mems.slice(0,90);
    if(S.moments.length>24)S.moments=S.moments.slice(0,18);
  }catch(e){}}
function save(silent){
  try{ trimStorage(); localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }
  catch(e1){
    try{ localStorage.removeItem(SAVE_KEY+'_hist'); localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }
    catch(e2){
      try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }
      catch(e3){ if(!silent)toast('存储空间不足：建议导出存档后清理浏览器缓存',true); return; } } }
  try{ localStorage.setItem(SAVE_KEY+'_hist',JSON.stringify([{at:Date.now(),data:JSON.stringify(S)}])); }catch(eh){}
  if(!silent)toast('已存档');
}
function migrateSave(o){
  if(!o)return o;
  if(!o.player)o.player={};
  o.player.sk=o.player.sk||{eff:10,com:10,doc:10,aes:10,plan:10,risk:10};
  o.chg=o.chg||{};o.items=o.items||[];o.health=o.health||{symptoms:[],note:''};
  o.commitLog=o.commitLog||[];o.endings=o.endings||[];o.moments=o.moments||[];
  return o;
}
function loadSave(){ try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;return migrateSave(JSON.parse(raw));}catch(e){return null;} }
function exportSave(){ try{ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=GAME_META.title+'-存档-'+fmtCal(S.cal)+'.json'; a.click(); toast('存档已导出，请妥善保存'); }catch(e){ toast('导出失败：'+e.message,true); } }
function handleImport(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{ try{ const data=migrateSave(JSON.parse(r.result));
      localStorage.setItem(SAVE_KEY,JSON.stringify(data));S=data;closeModalAll();render();toast('存档已恢复'); }
    catch(e){toast('文件无法识别：'+e.message,true);} };
  r.readAsText(f);
}
function importClick(){ const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=handleImport;i.click(); }
function wipeSave(){ if(!confirm('确定删除存档？此操作不可恢复。请先导出备份。'))return; try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(SAVE_KEY+'_hist');}catch(e){} location.reload(); }

/* ---------- 账本（引擎：所有现金变动唯一入口） ---------- */
function addCash(amount,reason,cat){
  S.player.cash+=amount;
  S.ledger.push({id:uid('led'),date:fmtCal(S.cal),reason,amount,cat:cat||(amount>=0?'收入':'支出')});
  if(S.player.cash<0){S.player.cash-=amount;S.ledger.pop();return false;}
  return true;
}
function spend(amount,reason,cat){ if(amount===0)return true; if(addCash(-amount,reason,cat)){toast((cat||'支出')+' '+money(-amount));return true;} toast('余额不足：'+reason,true); return false; }
function income(amount,reason,cat){ addCash(amount,reason,cat); toast('入账 '+money(amount)); }
function money(n){const v=Number(n)||0;return (v<0?'-':'')+GAME_META.currency+Math.abs(v).toLocaleString('zh-CN');}

/* ---------- 消息 ---------- */
function pushMsg(fromId,text,kind){
  try{
    if(fromId&&fromId!=='sys'&&!getCast(fromId)){fromId='sys';text='['+text+']';}
  }catch(e){}
  S.msgs.push({id:uid('msg'),from:fromId,text,slot:S.cal.slot,date:fmtCal(S.cal),kind:kind||'sys',read:false});
  if(S.msgs.length>520){let over=S.msgs.length-460;
    for(let i=0;i<S.msgs.length&&over>0;i++){if(S.msgs[i].read){S.msgs.splice(i,1);i--;over--;}}
    if(over>0)S.msgs.splice(0,over);}
  if(S.ui.page==='home'||S.ui.thread===fromId)render();
}
function unreadCount(){return S.msgs.filter(m=>!m.read).length;}
function pushMem(who,title,text){S.mems.unshift({id:uid('mem'),who:who||null,title,date:fmtCal(S.cal),text});}
function fired(id){return !!S.events['f:'+id];}
function markFired(id){S.events['f:'+id]=1;}

/* ---------- 逃生门与弹窗栈 ---------- */
let modalStack=[];
function openModal(html,opts){
  const ov=document.createElement('div');ov.className='modal';
  const closeRow=(opts&&opts.lock)?'':'<div style="margin-top:14px"><button class="btn sm ghost" onclick="closeModalTop()">关闭</button></div>';
  ov.innerHTML='<div>'+(html)+closeRow+'</div>';
  if(opts&&opts.lock)ov.dataset.lock='1';
  document.body.appendChild(ov);modalStack.push(ov);
  if(!opts||opts.clickClose!==false) ov.addEventListener('click',e=>{if(e.target===ov&&!ov.dataset.lock)closeModalTop();});
  return ov;
}
function closeModalTop(){const m=modalStack.pop();if(m)m.remove();}
function closeModalAll(){while(modalStack.length)closeModalTop();}
function panicHome(){closeModalAll();if(S){S.ui.page='home';S.ui.sub=null;S.ui.thread=null;try{render();}catch(e){}}toast('已回到首页');}

/* ---------- 关系引擎 ---------- */
const STAGE_NAME={stranger:'未相识',met:'相识',friends:'朋友',dating:'恋人',secret:'秘密关系',ex:'前任',engaged:'已订婚',married:'已婚（与他）'};
function getRel(id){
  if(!S.rel[id])S.rel[id]={stage:'stranger',aff:0,metDate:null,lastDate:null,cooldown:0};
  const r=S.rel[id];if(!r.cooldown)r.cooldown=0;return r;
}
function setStage(id,st){const r=getRel(id);if(r.stage!==st){r.stage=st;
  if(st==='dating'||st==='secret'){r.metDate=r.metDate||fmtCal(S.cal);
    if(st==='secret'&&!r.anniv){r.anniv=fmtCal(S.cal);pushMem(id,'纪念日',fmtDate(S.cal)+'，你们确认了这段关系的名字。');}}}}
function affAdd(id,v){const r=getRel(id);const old=r.aff;
  if(v>0)v=Math.max(1,Math.round(v*0.5));
  try{const c=getCast(id);if(v>0&&S.player.prefType&&c&&c.t===S.player.prefType)v=v+1;}catch(e){}
  r.aff=clamp(r.aff+v,0,100);
  GAME_META.milestones.forEach((th,i)=>{if(old<th&&r.aff>=th&&!S.events['hl:'+id+':'+i]){S.events['hl:'+id+':'+i]=1;
    const c=getCast(id);const line=(c&&c.heart&&c.heart[i])||pick(['「最近发生的一些小事，我都想讲给你听。」','「你出现以后，我的日子好像多了一条轨道。」']);
    pushMsg(id,line);}});
}
function isAngry(mid){const r=S.rel[mid];return r&&r.angryUntil&&r.angryUntil>dayStamp(S.cal);}
function makeAngry(mid,days){const r=getRel(mid);r.angryUntil=dayStamp(S.cal)+days;
  pushMsg(mid,pick(['「这次的事，我不想再提第二遍。」他声音冷了下来，「给我一点时间。」','「我先缓一缓。不是你的问题——是我需要自己消化。」']));
  affAdd(mid,-5);S.player.mood=clamp(S.player.mood-8,0,100);
  toast((getCast(mid)||{name:'他'}).name+'生气了（约'+days+'天后缓和）',true);}

/* ---------- 时间推进（唯一时钟入口） ---------- */
const REGENERABLE=/^(ev:|gen_invite|sys_pamper|wev:)/;
function advanceSlots(n,force){
  let guard=0;
  while(n-->0&&guard++<500){
    S.cal.slot++;
    if(S.cal.slot>3){S.cal.slot=0;S.cal=addDays(S.cal,1);dailySettle();if(S.cal.d===1)monthlySettle();}
    checkTriggers();
    if(S.pending.length&&!force)break;
  }
  if(force&&S.pending.length){
    S.pending=S.pending.filter(p=>!REGENERABLE.test(p));
    if(S.pending.length)toast('快进期间跳过了部分日常小事',true);
  }
}
function nextSlot(){advanceSlots(1);}
function nextDay(){advanceSlots(4-S.cal.slot,true);}
function toMonthEnd(){advanceSlots((daysInMonth(S.cal.y,S.cal.m)-S.cal.d)*4+(4-S.cal.slot),true);}
function nextMonth(){let nn=(S.cal.m===12?S.cal.y+1:S.cal.y),mm=(S.cal.m===12?1:S.cal.m+1);const dd=Math.min(S.cal.d,daysInMonth(nn,mm));
  advanceSlots((daysInMonth(S.cal.y,S.cal.m)-S.cal.d)*4+(4-S.cal.slot)+(dd-1)*4,true);}
function energyCap(){return clamp(60+Math.round(S.player.physique*0.4),40,110);}
function dailySettle(){
  if(S.cal.m===1&&S.cal.d===1&&!S.events['myage:'+S.cal.y]){S.events['myage:'+S.cal.y]=1;
    if(typeof S.player.age==='number'){S.player.age++;pushMsg('sys','新的一年到了。你又长了一岁，今年 '+S.player.age+' 岁。');}}
  const living=Math.round(25+Math.random()*35);
  addCash(-living,'日常吃穿用度','生活');
  S.player.satiety=clamp((S.player.satiety==null?70:S.player.satiety)-30,0,100);
  if(S.player.satiety<20){
    S.player.mood=clamp(S.player.mood-4,0,100);S.player.physique=clamp(S.player.physique-1,0,100);
    if(!S.pending.some(p=>p==='sys_eat'))S.pending.push('sys_eat');
  }
  S.weather=pick(['晴','多云','小雨','大雨']);
  S.tidbit=pick(['渡口的风总是比市里先凉。','早市的摊主们在聊今天的客流。','写字楼灯下有加班的背影。','江对岸在放一场看不清的烟花。','上有雨云，柏油路亮起来。']);
  S.player.mood=clamp(S.player.mood+(S.player.mood<60?1:-1),0,100);
  for(const id in S.rel){const r=S.rel[id];if(r.cooldown>0)r.cooldown--;}
  /* 清晨：认识的人 25% 会主动发来日常消息（并进动态流） */
  if(Math.random()<0.25){
    const met=Object.keys(CAST).concat(Object.keys(CAST2)).filter(id=>S.rel[id]&&['met','dating','secret','friends','married'].includes(S.rel[id].stage));
    if(met.length){const id=pick(met);const line=pick(mL(id).chatReply);
      pushMsg(id,line);S.moments.unshift({id:uid('mo'),who:id,text:line,date:fmtCal(S.cal),liked:false,commented:false});
      if(S.moments.length>24)S.moments.pop();}
  }
  THEME_HOOKS.daily&&THEME_HOOKS.daily();
}
function monthlySettle(){
  const y=S.cal.y,m=S.cal.m;
  if(S.career.job){const c=CAREERS[S.career.job];if(c&&c.salary&&c.salary[S.career.level]){
    const s=c.salary[S.career.level];addCash(s,'工资（'+c.levels[S.career.level]+'）','工资');}}
  addCash(-S.home.rent,S.home.name+'月租','房租');
  THEME_HOOKS.monthly&&THEME_HOOKS.monthly();
}
function monthLedger(y,m){let inc=0,exp=0;S.ledger.forEach(e=>{
  if(e.date===y+'.'+String(m).padStart(2,'0')+'.'+String(e.date.split('.')[2]||'1')){/*noop*/}
  if(e.date.startsWith(y+'.'+String(m).padStart(2,'0')))e.amount>0?inc+=e.amount:(exp-=e.amount);});
  return {inc,exp};}

/* ---------- 主题扩展钩子（换题材时在 THEME SLOTS 附近覆写内容） ---------- */
const THEME_HOOKS={daily:null,monthly:null,customTriggers:[]};
function checkTriggers(){
  /* 引擎通用触发器 */
  if(S.cal.slot===1&&Math.random()<0.62&&!S.pending.length){
    const pool=RANDOM_EVENTS.filter(e=>(!e.cond||e.cond(S))&&!(S.events['cd:'+e.id]>dayStamp(S.cal)));
    if(pool.length){const emo=pool.filter(e=>['里程碑','情绪','烟火','工作'].includes(e.who));
      const e=(emo.length&&Math.random()<0.5)?pick(emo):pick(pool);
      S.events['cd:'+e.id]=dayStamp(S.cal)+12;S.pending.push('ev:'+e.id);}}
  /* 主动邀约：恋人/秘密且无冷却，清晨 10% */
  if(S.cal.slot===0&&Math.random()<0.10){
    const cands=Object.keys(CAST).concat(Object.keys(CAST2)).filter(id=>S.rel[id]&&(S.rel[id].stage==='dating'||S.rel[id].stage==='secret')&&S.rel[id].cooldown<=0&&!S.pending.some(p=>String(p).indexOf('gen_invite')===0));
    if(cands.length)S.pending.push('gen_invite:'+pick(cands));}
  /* 婚姻线离婚触发（有-wife 成员题材用） */
  if(S.cal.slot===0&&!S.pending.length){
    for(const did in S.rel){const rr=S.rel[did],dm=getCast(did);
      if(!dm||!dm.wife)continue;
      if((rr.stage==='dating'||rr.stage==='secret')&&rr.aff>=82&&!fired('dv:'+did)&&rr.cooldown<=0){
        S.pending.push('sys_divorce:'+did);markFired('dv:'+did);break;}}}
  /* 求婚触发 */
  if(S.cal.slot===0&&!S.pending.length&&GAME_META.features.proposal){
    for(const did in S.rel){const rr=S.rel[did],dm=getCast(did);
      if(!dm)continue;
      if((rr.stage==='dating'||rr.stage==='secret')&&rr.aff>=88&&!fired('pp:'+did)&&rr.cooldown<=0&&(!dm.wife||dm.divorcedForYou)){
        S.pending.push('sys_propose:'+did);markFired('pp:'+did);break;}}}
  /* 高好感糖（宠溺） */
  if(S.cal.slot===1&&Math.random()<0.12){
    const sweet=Object.keys(CAST).concat(Object.keys(CAST2)).filter(id=>S.rel[id]&&['dating','secret','engaged','married'].includes(S.rel[id].stage)&&S.rel[id].aff>=70);
    if(sweet.length)S.pending.push('sys_pamper:'+pick(sweet));}
  /* 冷淡太久的小冲突 */
  if(S.cal.slot===2){
    for(const cid in S.rel){const rr=S.rel[cid],cm=getCast(cid);
      if(!cm||!GAME_META.features.angry)continue;
      if(['dating','secret'].includes(rr.stage)&&rr.lastDate&&cmpCal(parseCal(rr.lastDate),S.cal)<=-14&&!isAngry(cid)&&Math.random()<0.15){
        S.pending.push('sys_conflict:'+cid);break;}}}
  /* 题材自定义触发器（THEME 提供，签名：(S)=>void，只允许 pushMsg/pending） */
  if(THEME_HOOKS.customTriggers&&THEME_HOOKS.customTriggers.length){
    for(const f of THEME_HOOKS.customTriggers){try{f(S);}catch(e){}}}
}
function parseCal(t){const p=String(t).split('.').map(Number);return {y:p[0],m:p[1],d:p[2]};}

/* ---------- 效果词表（fx DSL） ---------- */
function applyFx(fx){
  (fx||[]).forEach(f=>{switch(f.k){
    case 'aff':affAdd(f.id,f.v);break;
    case 'aff_rand_met':{const cds=Object.keys(CAST).concat(Object.keys(CAST2)).filter(x=>S.rel[x]&&['met','dating','secret','friends'].includes(S.rel[x].stage));if(cds.length)affAdd(pick(cds),f.v);break;}
    case 'stage':setStage(f.id,f.v);break;
    case 'cash':f.v>=0?income(f.v,f.reason||'收入'):spend(-f.v,f.reason||'支出');break;
    case 'slot':if(f.n)advanceSlots(f.n);break;
    case 'msg':{let mf=f.from;if(mf==='__rand'){const cds=Object.keys(CAST).concat(Object.keys(CAST2)).filter(x=>S.rel[x]&&S.rel[x].stage!=='stranger');mf=cds.length?pick(cds):'sys';}pushMsg(mf,f.text);break;}
    case 'mem':pushMem(f.who,f.title,f.text);break;
    case 'mem_x':pushMem(null,f.title,f.text);break;
    case 'relcool':getRel(f.id).cooldown=f.v;break;
    case 'energy':S.player.energy=clamp(S.player.energy+f.v,0,energyCap());break;
    case 'mood':S.player.mood=clamp(S.player.mood+f.v,0,100);break;
    case 'rep':S.career.rep=Math.max(0,(S.career.rep||0)+f.v);break;
    case 'skill':{const p=f.id.split(':');S.player.sk[p[0]]=clamp((S.player.sk[p[0]]||0)+(p[1]?+p[1]:f.v),0,100);break;}
    case 'item':addItem(f.id,f.n||1);break;
    case 'flag':S.events['c:'+f.kk]=f.v;break;
    case 'phys':S.player.physique=clamp(S.player.physique+f.v,0,100);break;
    case 'satiety':S.player.satiety=clamp((S.player.satiety==null?70:S.player.satiety)+f.v,0,100);break;
    case 'beauty':S.player.beauty=clamp(S.player.beauty+f.v,0,100);break;
    case 'x':if(S.chg[f.id]==null)S.chg[f.id]=(f.v||0);else S.chg[f.id]=(S.chg[f.id]||0)+f.v;break;
    case 'ending':if(!S.endings.includes(f.id)){S.endings.push(f.id);toast('达成结局：'+f.id);}break;
    case 'gamble':{const dc=(f.dc||30),sk=(S.player.sk[f.sk||'risk']||0)+((S.player.charm||50)-30)*0.1;
      if(sk>=dc){(f.okfx||[]).forEach(x=>applyFx([x]));toast('这一次，你处理得漂亮');}
      else{(f.badfx||[]).forEach(x=>applyFx([x]));toast('这一次没处理好……',true);}break;}
  }});
  save(true);
}

function itemIdName(id,cat){const all=Object.keys(GOODS).map(k=>GOODS[k]).flat().find(g=>g.id===id);return all?all.name:id;}

const REPLY_ACTS={
  busy:['在忙。晚点找你。','刚脱开身。怎么了？','这会儿走不开，十点后回你。'],
  chat:['嗯，在。','然后呢？','正在听。','有点想你，随口一说。'],
  meet:['这周末我腾出来。地方你挑。','可以。我去接你。'],
  food:['吃了吗？别骗我。','刚出锅。你要不要来一口？'],
  tired:['去休息。这是命令。','热水澡，热牛奶，十一点前睡。'],
  night:['晚安。做个好梦。','睡吧。我这边收个尾就睡。'],
  morning:['早。','早。记得吃早饭。'],
  miss:['……这句我看了三遍。','巧了。我也在想。'],
  love:['……我知道。我也是。','这句话，留着见面说。'],
  sad:['谁？说来听听。','抱抱。'],
  thanks:['跟我不用谢。','小意思。']
};
function detectIntent(text){
  const rules=[[/想你|想我|见不到/,'miss'],[/在忙|开会|加班|工作/,'busy'],[/周末|有空|见面|约|见你/,'meet'],
   [/吃|饭|饿|外卖|宵夜/,'food'],[/累|辛苦|委屈/,'tired'],[/雨|天气|降温|冷/,'weather'],[/晚安|睡了|困/,'night'],
   [/早安|^早$|起床/,'morning'],[/难过|不开心|生气|烦/,'sad'],[/谢谢|感谢/,'thanks'],[/爱|喜欢/,'love']];
  for(const r of rules){if(r[0].test(text))return r[1];}
  return 'chat';
}
function genReplies(fid,text){
  if(fid==='sys')return [];
  const m=getCast(fid);if(!m)return [];
  if(isAngry(fid))return [pick(['……','先不聊。','「已读。」他什么都没说。'])];
  let key=detectIntent(text);
  if(key==='chat'&&S.cal.slot===3)key='night';
  if(key==='chat'&&S.cal.slot===0)key='morning';
  if(key==='weather')key='chat';
  const pool=(REPLY_ACTS[key]&&REPLY_ACTS[key].length?REPLY_ACTS[key]:REPLY_ACTS.chat).concat(mL(fid).chatReply);
  const out=[pick(pool)];
  if(Math.random()<0.30)out.push(pick(['你呢？','在干嘛？','吃饭了吗？','早点休息。']));
  return out.slice(0,2);
}
function sendChat(fid,text){
  text=String(text||'').trim().slice(0,120);if(!text)return;
  if(fid!=='sys'){
    const st=dayStamp(S.cal);
    const cnt=(S.events['chat:'+fid]===st)?(S.events['chatc:'+fid]||0):0;
    if(cnt>=2){toast('今天已经聊过两次了——感情也需要消化时间（明天再聊）',true);return;}
    S.events['chat:'+fid]=st;S.events['chatc:'+fid]=cnt+1;
  }
  S.msgs.push({id:uid('msg'),from:fid,text,slot:S.cal.slot,date:fmtCal(S.cal),kind:'me',read:true});
  if(fid!=='sys'){
    const before=getRel(fid).aff;
    affAdd(fid,4);
    const gained=getRel(fid).aff-before;
    toast(contactName(fid)+' 关系 +'+gained+'（当前 '+getRel(fid).aff+'）');
    genReplies(fid,text).forEach(r=>pushMsg(fid,r,'chat'));
  } else pushMsg('sys','收到。系统日志会记录你的重要节点。');
  save(true);render();
}

function confirmStageGate(mid){
  const c=getCast(mid),r=getRel(mid);
  if(r.aff<60){toast('关系还没到位（需要心动 ≥60）',true);return;}
  if(c.wife){
    setStage(mid,'secret');affAdd(mid,5);
    pushMem(mid,'关系的名字',fmtDate(S.cal)+'，你与'+c.name+'确认了这段关系：没有名分，但彼此诚实、自愿。');
    pushMsg(mid,'「我知道这对你不公平。所以我不会催你，也不会骗你。」');
  } else {
    setStage(mid,'dating');affAdd(mid,5);
    pushMem(mid,'在一起的这一天',fmtDate(S.cal)+'，你与'+c.name+'确立关系。');
    pushMsg(mid,'「从今天开始，我把自己的名字排在你的事前面。」');
  }
  save(true);render();
}
function doBreakup(mid){
  const r=getRel(mid);const c=getCast(mid);if(!c)return;
  if(!confirm('确定和 '+c.name+' 分手吗？'))return;
  r.stage='ex';r.cooldown=14;
  pushMem(mid,'结束',fmtDate(S.cal)+'，你与'+c.name+'分开了。有些路的尽头，是为了走别的路。');
  toast('已分手');save(true);render();

function tryReconcile(mid){
  const r=getRel(mid);const c=getCast(mid);if(!c)return;
  if(r.aff<40){toast('关系还没修复到能重新开始的程度（心动 ≥40）',true);return;}
  setStage(mid,'friends');affAdd(mid,2);
  pushMem(mid,'重新认识',fmtDate(S.cal)+'，你与'+c.name+'决定以朋友的身份重新认识。');
  save(true);render();
}

function fatal(e){
  try{console.error(e);}catch(e2){}
  if(window.__fatalShown)return;window.__fatalShown=true;
  try{window.showFatalPanel(String((e&&e.message)||e));}catch(e2){alert('出了点小问题：'+String((e&&e.message)||e));}
  window.__fatalShown=false;
}

function useItem(id){
  const it=S.items.find(x=>x.id===id&&x.qty>0);if(!it){toast('没有这件了',true);return;}
  let use=null;Object.keys(GOODS).forEach(k=>{const g=GOODS[k].find(x=>x.id===id);if(g)use=g.use;});
  if(!use){toast('这件物品没有即用效果',true);return;}
  it.qty--;if(it.qty<=0)S.items.splice(S.items.indexOf(it),1);
  const fx=[];
  if(use.energy)fx.push({k:'energy',v:use.energy});
  if(use.mood)fx.push({k:'mood',v:use.mood});
  if(use.satiety)fx.push({k:'satiety',v:use.satiety});
  if(use.phys)fx.push({k:'phys',v:use.phys});
  if(use.skill){const p=String(use.skill).split(':');fx.push({k:'skill',id:p[0],v:+p[1]});}
  applyFx(fx);toast('已使用：'+it.name);save(true);render();
}

    return '<div class="kv" style="'+(got?'':'opacity:.45')+'"><span class="k">'+(got?'🏆':'🔒')+' '+esc(a.n)+'</span><span>'+esc(a.d)+'</span></div>';}).join('')+'</div>';
  const ends=S.endings.length?'<div class="card soft">'+S.endings.map(e=>'<div class="kv"><span class="k">🏆</span><span style="color:var(--accent-hi)">'+esc(e)+'</span></div>').join('')+'</div>':'';
  return topbar('更多 · '+GAME_META.title,GAME_META.version)+
  '<div class="sect">存档</div><div class="card soft" style="font-size:12px;line-height:2">'+
  '<div>📲 <b>自动保存</b>：游玩中每一步都会自动记录，平时无需任何操作。</div>'+
  '<div>📤 <b>导出存档</b>：换设备或备份时使用，会自动下载存档文件。</div>'+
  '<div>📥 <b>读取存档</b>：选择之前导出的文件即可恢复进度（会覆盖当前）。</div>'+
  '<div class="row" style="margin-top:10px">'+
  '<button class="btn primary" style="flex:1" onclick="save(false)">手动存档</button>'+
  '<button class="btn gold" style="flex:1" onclick="exportSave()">导出存档</button></div>'+
  '<div class="row" style="margin-top:8px">'+
  '<button class="btn" style="flex:1" onclick="importClick()">读取存档</button>'+
  '<button class="btn danger" style="flex:1" onclick="wipeSave()">删除存档</button></div>'+
  '<div style="font-size:11px;color:var(--ink-dim);margin-top:8px">⚠️ 读取会覆盖当前存档且不可恢复，请先导出。</div></div>'+
  '<div class="sect">成就</div>'+ach+
  (ends?'<div class="sect">已达成结局（'+S.endings.length+'）</div>'+ends:'')+
  '<div class="sect">关于本作</div><div class="card soft" style="font-size:11.5px;color:var(--ink-dim);line-height:1.9">'+
  '<div style="color:var(--accent-hi);font-size:12.5px;margin-bottom:4px">'+esc(GAME_META.tagline)+'</div>'+
  GAME_META.disclaimer.map(d=>'<div>· '+esc(d)+'</div>').join('')+
  '<div style="margin-top:6px;font-size:10px;opacity:.7">引擎版本 '+esc(GAME_META.version)+'</div></div>';
}

/* ---------- 成就 [SLOT 8：题材重写] ---------- */
const ACHIEVEMENTS=[
  {n:'初来北岸',d:'开始你在小城的新生活',test:S=>true},
  {n:'一面之缘',d:'认识任何一位城里人',test:S=>Object.keys(S.rel).some(id=>getCast(id)&&S.rel[id].stage!=='stranger')},
  {n:'攒下一点底',d:'存款突破 ¥80,000',test:S=>S.player.cash>=80000},
  {n:'身体是本钱',d:'体魄达到 80',test:S=>S.player.physique>=80},
  {n:'城里旧友',d:'与城里认识的人建立起工作外的熟络关系',test:S=>Object.keys(S.rel).filter(id=>getCast(id)).length>=2},
  {n:'一周年纪念',d:'在这座城市待满一年',test:S=>cmpCal(S.cal,S.startCal)>=365}
];

/* ---------- 角色创建 ---------- */
let draft={};
function renderTitle(){
  document.body.classList.remove('playing');
  const hasSave=!!loadSave();
  document.body.classList.add('title-show');
  $('#view').innerHTML='<div class="title-hero">'+
   '<div style="font-size:10px;letter-spacing:6px;color:var(--ink-dim)">SINGLE-FILE LIFE SIM</div>'+
   '<h1>'+esc(GAME_META.title)+'</h1>'+
   '<div style="font-size:13px;color:var(--ink-dim);letter-spacing:2px">'+esc(GAME_META.tagline)+'</div>'+
   ((AGE_OK)?(
    '<div style="margin:24px 0"><button class="btn primary" style="padding:12px 38px" onclick="startCreate()">开始新的生活</button></div>'+
    (hasSave?'<button class="btn gold" style="padding:10px 30px" onclick="continueGame()">继续上次的生活</button>':'')
   ):(
    '<div class="card soft" style="margin-top:20px;text-align:left">'+
    '<div style="color:var(--accent-hi);font-size:13px;margin-bottom:6px">【健康体验公告】</div>'+
    GAME_META.disclaimer.map(d=>'<div style="font-size:11.5px;color:var(--ink-dim);line-height:1.9">'+esc(d)+'</div>').join('')+'</div>'+
    '<div style="margin:20px 0"><button class="btn primary" style="padding:12px 38px" onclick="agreeAge()">我已满 18 周岁，进入作品</button></div>'+
    '<div style="font-size:11px;color:var(--ink-dim)">未成年人请关闭本页面。</div>'
   ))+
   '<div class="card soft" style="text-align:left;font-size:11px;color:var(--ink-dim);line-height:1.9">'+
   '<div style="color:var(--accent-hi);margin-bottom:4px">免责声明</div>'+
   '本作为虚构作品，与现实人物、事件、团体无关；如体验过程中感到不适，请立即停止。</div>'+
   '<div style="font-size:10px;color:var(--ink-dim);opacity:.6;margin-top:14px">引擎演示档 '+esc(GAME_META.version)+'</div>'+
   '</div>';
}
function agreeAge(){AGE_OK=true;renderTitle();}
function startCreate(){
  draft={look:'清爽干净',style:'简单耐看',origin:'fresh',alloc:{beauty:0,physique:0,charm:0,wit:0}};
  let html='<h3>你是什么样的人？</h3>'+
   '<input type="text" id="c-name" maxlength="8" placeholder="怎么称呼你">'+
   '<label class="f">年龄</label><div class="opt-row" id="c-age"></div>'+
   '<label class="f">气质外观</label><div class="opt-row" id="c-look"></div>'+
   '<label class="f">穿搭风格</label><div class="opt-row" id="c-style"></div>'+
   '<label class="f">来这座城的身份（决定初始家底与状态）</label><div id="c-origin"></div>'+
   '<label class="f">天赋加点（剩余 <b id="alloc-pts" style="color:var(--accent-hi)">6</b> 点 · 每点 +4）</label>'+
   ['beauty','physique','charm','wit'].map(k=>'<div class="kv"><span class="k">'+({beauty:'气色·美貌',physique:'体魄',charm:'魅力',wit:'学识'}[k])+'</span>'+
    '<span><button class="btn sm ghost" onclick="allocPt(\''+k+'\',-1)">−</button>'+
    '<b id="alloc-'+k+'" style="display:inline-block;width:26px;text-align:center;color:var(--accent-hi)">0</b>'+
    '<button class="btn sm ghost" onclick="allocPt(\''+k+'\',1)">＋</button></span></div>').join('')+
   '<label class="f">偏好（对齐的对象，关系加成 +1）</label><div id="c-pref"></div>'+
   '<div class="notice gold" style="margin-top:10px;font-size:11.5px">美貌影响气色、首印象与邀约运；体魄管理精力；魅力放大社交；学识抬升交付质量与收入。</div>'+
   '<button class="btn primary block" style="margin-top:16px" onclick="createPlayer()">开始新生活</button>';
  openModal(html,{});
  const optsRow=(el,opts,def)=>{el.innerHTML=opts.map((o,i)=>'<div class="opt '+(o===def?'on':'')+'" data-v="'+o+'" onclick="pickOpt(this,\''+(el.id.replace('c-',''))+'\')">'+o+'</div>').join('');};
  optsRow($('#c-age'),['22','26','30','34'],'26');
  optsRow($('#c-look'),['清爽干净','明艳大方','温软邻家'],'清爽干净');
  optsRow($('#c-style'),['简单耐看','张扬明快','慵懒随意'],'简单耐看');
  $('#c-origin').innerHTML=Object.keys(ORIGINS).map(k=>'<button class="choice" onclick="pickOrigin(\''+k+'\')">'+ORIGINS[k].name+'<span class="hint">'+esc(ORIGINS[k].d)+' · 美貌'+ORIGINS[k].beauty+' 体魄'+ORIGINS[k].physique+' 魅力'+ORIGINS[k].charm+' 学识'+ORIGINS[k].wit+'</span></button>').join('');
  draft.prefType=null;
  $('#c-pref').innerHTML=Object.entries({steady:'要踏实的同学，安安稳稳',warm:'要情绪价值的，暖和贴心',spark:'要新鲜感的，冒险好玩',deep:'要成熟稳重的，靠得住'}).map(([k,v])=>'<button class="choice" onclick="pickPref(\''+k+'\')">'+v+'</button>').join('');
}
function pickOpt(el,key){[...el.parentElement.children].forEach(c=>c.classList.remove('on'));el.classList.add('on');draft[key]=el.dataset.v;}
function pickPref(k){draft.prefType=k;toast('偏好已记下：'+k);}
function pickOrigin(k){draft.origin=k;
  document.querySelectorAll('#c-origin .choice').forEach(b=>{b.style.borderColor='var(--line)';b.style.background='var(--panel2)';});
  event.currentTarget.style.borderColor='var(--accent)';}
function allocTotal(){return Object.values(draft.alloc||{}).reduce((a,b)=>a+b,0);}
function allocPt(k,d){
  draft.alloc=draft.alloc||{beauty:0,physique:0,charm:0,wit:0};
  if(d>0&&allocTotal()>=6){toast('天赋点用完了',true);return;}
  if(d<0&&draft.alloc[k]<=0)return;
  draft.alloc[k]+=d;
  document.getElementById('alloc-'+k).textContent=draft.alloc[k];
  document.getElementById('alloc-pts').textContent=6-allocTotal();
}
function createPlayer(){
  const name=($('#c-name').value||'').trim();
  if(!name){toast('请先给自己起个名',true);return;}
  draft.age=draft.age||'26';draft.look=draft.look||'清爽干净';draft.style=draft.style||'简单耐看';
  const o=ORIGINS[draft.origin||'fresh'];
  const cashBase={fresh:12000,local:18000,steady:24000}[draft.origin||'fresh'];
  S=newState({name,age:parseInt(draft.age),look:draft.look,style:draft.style,origin:draft.origin,cash:cashBase,
    beauty:clamp(o.beauty+(draft.alloc.beauty*4),20,95),
    physique:clamp(o.physique+(draft.alloc.physique*4),20,95),
    charm:clamp(o.charm+(draft.alloc.charm*4),20,95),
    wit:clamp(o.wit+(draft.alloc.wit*4),20,95),
    prefType:draft.prefType});
  pushMem(null,'初来乍到',fmtDate(S.cal)+'，'+name+'开始了在'+GAME_META.city+'的新生活。'+fmtCal(S.cal)+'的那顿晚饭，是这家渡口面馆的第一碗。');
  closeModalAll();
  S.pending.push('opening_welcome');
  pushMsg('sys','【新手引导】\n1. 底部页签切换 日历/人物/城市/更多。\n2. 日历页「下一天」推进时间：每天 4 个时段。\n3. 城市 → 各地点闲逛会遇见人。\n4. 手机里查消息、回消息。\n5. 工作台：入职/接单由你决定。\n6. 记得吃饭——饱食、体魄、心情都是硬数值。');
  SCENES['opening_welcome']=()=>({who:GAME_META.city,title:'抵达的第一天',
    body:GAME_META.startCal.y+'年'+GAME_META.startCal.m+'月，'+name+'带着全部家当来了'+GAME_META.city+'。\n\n风从渡口吹过来，有点咸，也有点温柔。第一件事，先下楼吃碗热汤面吧。',
    choices:[{t:'下二楼，去渡口面馆（遇见颜叔）',fx:[{k:'slot',n:1}],next:'yan_shu_meet'},
             {t:'先在出租屋收拾行李安顿下来',hint:'心情 +3',fx:[{k:'mood',v:3},{k:'slot',n:1}]}]});
  save(true);closeModalTop();render();processPending();
}
function continueGame(){S=loadSave();closeModalAll();render();}
function bootStart(){
  S=null;renderTitle();try{renderNav();}catch(e){}
  document.title=GAME_META.title;
}

/* ---------- 致命错误安心面（引擎，勿删） ---------- */
window.__fatalShown=false;
function showFatalPanel(msgText){
  try{
    const el=document.createElement('div');el.className='modal';el.innerHTML='<div style="text-align:center">'+
    '<div style="font-size:30px">🧯</div><b>出了点小问题</b>'+
    '<div style="font-size:12px;color:var(--ink-dim);max-width:80%;text-align:left;line-height:1.7;margin-top:8px;word-break:break-all">'+esc(msgText)+'</div>'+
    '<button class="btn primary" style="margin-top:12px" onclick="this.closest(\'.modal\').remove();window.__fatalShown=false">继续游玩（存档仍在）</button>'+
    '<button class="btn sm ghost block" style="margin-top:8px" onclick="panicHome()">回到首页</button></div>';
    document.body.appendChild(el);modalStack.push(el);
  }catch(e2){}
}
window.addEventListener('error',function(e){
  if(window.__fatalShown)return;window.__fatalShown=true;
  try{showFatalPanel(String(e.message||e));}catch(e2){}
});
if(S!==null){bootStart();}
else{bootStart();}
</script>
